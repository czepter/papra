name: Build fork integration image

on:
  push:
    branches: [chore/integration]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-integration-image
  cancel-in-progress: true

jobs:
  image:
    name: Build and push integration image
    # Only on the fork, never upstream
    if: github.repository != 'papra-hq/papra'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Capture build metadata
        id: meta
        run: |
          echo "git_commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(git show -s --format=%cI HEAD)" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push rootless image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./packages/app/Dockerfile.rootless
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PAPRA_VERSION=integration-${{ steps.meta.outputs.short_sha }}
            GIT_COMMIT=${{ steps.meta.outputs.git_commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          tags: |
            ${{ steps.meta.outputs.image }}:integration
            ${{ steps.meta.outputs.image }}:integration-${{ steps.meta.outputs.short_sha }}
